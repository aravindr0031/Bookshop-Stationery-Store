<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - The Bookery - Books & Stationery Store</title>
  <link rel="icon" type="image/png" href="images/favicon.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            'accent': '#d97706', /* Warm Amber */
            'brand-dark': '#0F172A', /* Deep Midnight Blue/Black */
            'brand-light': '#F8FAFC', /* Clean Slate White */
            'brand-muted': '#64748B' /* Cool Gray */
          }
        }
      }
    }
  </script>
  
  <style>
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in {
      animation: fadeInUp 0.8s ease-out;
    }

    [dir="rtl"] { direction: rtl; }

    /* Ensure no horizontal scroll */
    html, body {
      overflow-x: hidden;
      width: 100%;
    }
  </style>
</head>
<body class="font-sans antialiased bg-brand-light dark:bg-brand-dark h-screen overflow-x-hidden flex flex-col transition-colors duration-300">

  <div class="absolute top-20 start-10 w-72 h-72 bg-accent/10 rounded-full blur-3xl animate-pulse pointer-events-none"></div>
  <div class="absolute bottom-20 end-10 w-96 h-96 bg-brand-muted/20 dark:bg-white/5 rounded-full blur-3xl animate-pulse pointer-events-none" style="animation-delay: 1.5s;"></div>

  <div class="flex-1 flex items-center justify-center p-4 pb-10">
    <div class="w-full max-w-sm">
      
      <div class="bg-white dark:bg-[#1E293B] shadow-2xl p-6 md:p-8 border border-gray-200 dark:border-gray-800 animate-fade-in relative z-10 group rounded-2xl">

        <div class="absolute top-0 start-0 w-full h-1 bg-gradient-to-r from-amber-600 to-transparent rounded-t-2xl"></div>

        <div class="text-center mb-6">
          <a href="index.html" class="inline-flex justify-center items-center gap-2 mb-6 hover:opacity-80 transition-opacity">
            <i class="fas fa-book-open text-amber-600 text-3xl"></i>
            <div class="flex flex-col text-left leading-tight">
              <span class="text-2xl font-serif font-bold text-brand-dark dark:text-brand-light">The <span class="text-amber-600 italic">Bookery</span></span>
            </div>
          </a>
          <h2 class="text-2xl font-semibold text-brand-dark dark:text-brand-light uppercase tracking-tight">Create Account.</h2>
        </div>

        <form class="flex flex-col gap-4" onsubmit="handleRegister(event)">

          <div>
            <label class="block text-[10px] font-medium uppercase tracking-widest text-brand-dark dark:text-brand-light mb-2">First Name</label>
            <input 
              type="text" 
              required
              placeholder="FIRST NAME"
              class="w-full px-3 py-3 bg-transparent border border-gray-300 dark:border-gray-700 text-brand-dark dark:text-brand-light text-xs uppercase tracking-widest focus:outline-none focus:border-accent dark:focus:border-accent focus:ring-1 focus:ring-accent rounded-md transition-all"
            />
          </div>

          <div>
            <label class="block text-[10px] font-medium uppercase tracking-widest text-brand-dark dark:text-brand-light mb-2">
              Email Address
            </label>
            <input 
              type="email" 
              required
              placeholder="YOUR.EMAIL@EXAMPLE.COM"
              class="w-full px-3 py-3 bg-transparent border border-gray-300 dark:border-gray-700 text-brand-dark dark:text-brand-light text-xs uppercase tracking-widest focus:outline-none focus:border-accent dark:focus:border-accent focus:ring-1 focus:ring-accent rounded-md transition-all"
            />
          </div>

          <div>
            <label class="block text-[10px] font-medium uppercase tracking-widest text-brand-dark dark:text-brand-light mb-2">
              Phone Number
            </label>
            <input 
              type="tel" 
              required
              placeholder="+1 234 567 8900"
              class="w-full px-3 py-3 bg-transparent border border-gray-300 dark:border-gray-700 text-brand-dark dark:text-brand-light text-xs uppercase tracking-widest focus:outline-none focus:border-accent dark:focus:border-accent focus:ring-1 focus:ring-accent rounded-md transition-all"
            />
          </div>

          <button 
            type="submit"
            class="w-full py-3 mt-4 bg-accent hover:bg-amber-700 text-white font-semibold uppercase tracking-widest text-xs transition-all duration-300 flex items-center justify-center gap-2 rounded-full shadow-lg shadow-accent/20"
          >
            <span>Register</span>
            <i class="fas fa-arrow-right text-[10px] rtl:rotate-180"></i>
          </button>

          <div class="relative my-6">
            <div class="absolute inset-0 flex items-center">
              <div class="w-full border-t border-gray-200 dark:border-gray-700"></div>
            </div>
            <div class="relative flex justify-center text-[10px] uppercase tracking-widest font-medium">
              <span class="px-3 bg-white dark:bg-[#1E293B] text-brand-muted">Or Sign Up With</span>
            </div>
          </div>

          <div class="flex flex-col gap-2.5">
            <button 
              type="button"
              class="flex items-center justify-center w-full px-3 py-2.5 border border-gray-300 dark:border-gray-700 hover:border-accent dark:hover:border-accent transition-colors bg-transparent rounded-full gap-2"
            >
              <svg class="w-4 h-4" viewBox="0 0 24 24">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
              </svg>
              <span class="text-[10px] font-medium uppercase tracking-widest text-brand-dark dark:text-brand-light">Google</span>
            </button>
            <button 
              type="button"
              class="flex items-center justify-center w-full px-3 py-2.5 border border-gray-300 dark:border-gray-700 hover:border-accent dark:hover:border-accent transition-colors bg-transparent rounded-full gap-2"
            >
              <i class="fab fa-apple text-base text-brand-dark dark:text-brand-light"></i>
              <span class="text-[10px] font-medium uppercase tracking-widest text-brand-dark dark:text-brand-light">Apple</span>
            </button>
            <button 
              type="button"
              class="flex items-center justify-center w-full px-3 py-2.5 border border-gray-300 dark:border-gray-700 hover:border-accent dark:hover:border-accent transition-colors bg-transparent rounded-full gap-2"
            >
              <i class="fab fa-facebook text-blue-600 text-base"></i>
              <span class="text-[10px] font-medium uppercase tracking-widest text-brand-dark dark:text-brand-light">Facebook</span>
            </button>
          </div>

        </form>

        <div class="mt-6 text-center text-[10px] sm:text-xs font-medium uppercase tracking-widest text-brand-muted">
          Already a Member? 
          <a href="login.html" class="text-brand-dark dark:text-brand-light hover:text-accent transition-colors ms-1 border-b border-accent pb-0.5 font-semibold">Sign In</a>
        </div>

      </div>

    </div>
  </div>

  <script>
    // Form Submission
    function handleRegister(event) {
      event.preventDefault();

      const button = event.target.querySelector('button[type="submit"]');
      const icon = button.querySelector('i');
      const span = button.querySelector('span');
      
      icon.className = 'fas fa-spinner fa-spin';
      span.innerText = 'CREATING ACCOUNT...';
      button.disabled = true;
      button.classList.add('opacity-50', 'cursor-not-allowed');

      setTimeout(() => {
        alert('Account created successfully! Redirecting to login...');
        window.location.href = 'login.html';
      }, 1500);
    }

    // Theme Toggle Function
    const themeToggle = document.getElementById('theme-toggle');
    const html = document.documentElement;

    function toggleTheme() {
      if (html.classList.contains('dark')) {
        html.classList.remove('dark');
        localStorage.setItem('theme', 'light');
      } else {
        html.classList.add('dark');
        localStorage.setItem('theme', 'dark');
      }
    }

    if (themeToggle) themeToggle.addEventListener('click', toggleTheme);
    if (localStorage.getItem('theme') === 'dark') html.classList.add('dark');

    // RTL Toggle Function
    const rtlToggle = document.getElementById('rtl-toggle');

    function toggleRTL() {
      if (html.getAttribute('dir') === 'rtl') {
        html.removeAttribute('dir');
        localStorage.setItem('direction', 'ltr');
      } else {
        html.setAttribute('dir', 'rtl');
        localStorage.setItem('direction', 'rtl');
      }
    }

    if (rtlToggle) rtlToggle.addEventListener('click', toggleRTL);
    if (localStorage.getItem('direction') === 'rtl') html.setAttribute('dir', 'rtl');
  </script>

</body>
</html>
